<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <div class="paper-noise" aria-hidden="true"></div>

  <header class="site-header">
    <a class="back-button" href="index.html">Home</a>
  </header>

  <main>
    <section class="section merch-page">

        <img class="merch-page-logo" src="assets/merch-art/wordmark-logo/wordmark-02-clean-white-transparent.png" alt="Tame Dog" />

      <div class="merch-grid">
        <a class="product-card" href="https://tame-dog-shop.fourthwall.com/products/black-graphic-tee" target="_blank" rel="noreferrer">

        <a class="product-card" href="https://tame-dog-shop.fourthwall.com/products/tame-dog-hoodie" target="_blank" rel="noreferrer">

          <p>$54.99</p>

        <a class="product-card" href="https://tame-dog-shop.fourthwall.com/products/i-love-tame-dog-tee" target="_blank" rel="noreferrer">

          <p>$34.99</p>
        </a>
        <a class="product-card" href="https://tame-dog-shop.fourthwall.com/products/star-graphic-tee" target="_blank" rel="noreferrer">

        <a class="product-card" href="https://tame-dog-shop.fourthwall.com/products/white-graphic-tee" target="_blank" rel="noreferrer">

          <p>$34.99</p>
        </a>
        <a class="product-card" href="https://tame-dog-shop.fourthwall.com/products/pins" target="_blank" rel="noreferrer">
          <img class="product-image" src="assets/merch/pins.webp" alt="Tame Dog pin set" />
          <h3>Pins</h3>
          <p>$12.00</p>

  <script src="app.js?v=20260923-miss-popup-1"></script>

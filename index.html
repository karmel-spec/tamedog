<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tame Dog | Official Site</title>
  <meta name="description" content="Official site for Tame Dog. Music and merch." />
  <link rel="stylesheet" href="styles.css?v=20260923-mobile-nav-fix-2" />
</head>
<body>
  <div class="paper-noise" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="#home" aria-label="Tame Dog home">
      <span class="logo-stamp logo-image"><img src="assets/merch-art/wordmark-logo/wordmark-02-clean-white-transparent.png" alt="Tame Dog logo" /></span>
    </a>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
      <a href="music.html">Music</a>
      <a href="merch.html">Merch</a>
    </nav>
  </header>

  <main id="home">
    <section class="hero" aria-label="Tame Dog homepage">
      <div id="music" class="music-intro">
        <p class="music-intro-text">FUSK OUT NOW</p>
        <a class="button dark" href="https://distrokid.com/hyperfollow/tamedog1/fusk?ref=release" target="_blank" rel="noreferrer">Stream</a>
      </div>

      <div class="video-half" aria-label="Looping YouTube music video">
        <div class="video-frame" data-video-id="92gtE1CN8XQ">
          <iframe
            title="Tame Dog music video"
            src="https://www.youtube.com/embed/92gtE1CN8XQ?start=4&autoplay=1&mute=1&loop=1&playlist=92gtE1CN8XQ&controls=0&modestbranding=1&playsinline=1"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>
          <a class="video-click-catcher" href="https://www.youtube.com/@tamedog" target="_blank" rel="noreferrer" aria-label="Open the Tame Dog YouTube channel"></a>
        </div>
      </div>
    </section>

    <section id="merch" class="section">
      <div class="section-head centered">
        <h2>Can You Catch The Flying Shirt?</h2>
      </div>
      <div class="flying-shirt-stage">
        <a class="flying-shirt" href="merch.html" aria-label="I Love Tame Dog tee — see it on the merch page">
          <img src="assets/merch/i-love-tame-dog-tee-transparent.png" alt="I Love Tame Dog tee" />
        </a>
        <img class="miss-popup" src="assets/merch/i-love-tamedog-popup.png" alt="" aria-hidden="true" />
      </div>
    </section>

  </main>

  <script src="app.js?v=20260923-miss-popup-1"></script>
</body>
</html>
